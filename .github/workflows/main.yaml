name: Main

on:
  push:
    branches:
      - main

  # Nightly build, after the dependency update workflow has run
  schedule:
    - cron: 0 3 * * *

  workflow_dispatch:

jobs:
  lint-test:
    name: Lint and Test
    uses: ./.github/workflows/lint-test.yaml
    secrets: inherit

  build-push:
    name: Build and Push
    uses: ./.github/workflows/build-push.yaml
    needs: [lint-test]
    secrets: inherit
    with:
      tags: latest,develop,${{ github.sha }}
