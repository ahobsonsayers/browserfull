name: Update Dependencies

on:
  # Nightly, before the build workflow
  schedule:
    - cron: 0 2 * * *

  workflow_dispatch:

permissions:
  contents: write

jobs:
  agent-browser:
    name: Update agent-browser
    uses: ahobsonsayers/github-workflows/.github/workflows/docker-update-app-version.yaml@main
    secrets: inherit
    with:
      app-name: agent-browser
      dockerfile: Dockerfile
      version-arg: AGENT_BROWSER_VERSION
      version-source: npm
      version-source-npm-package: agent-browser

  clearcote-version:
    name: Update clearcote (Chromium)
    needs: [agent-browser]
    uses: ahobsonsayers/github-workflows/.github/workflows/docker-update-app-version.yaml@main
    secrets: inherit
    with:
      app-name: clearcote
      dockerfile: Dockerfile
      version-arg: CLEARCOTE_VERSION
      version-source: command
      version-source-command: >-
        curl -s https://api.github.com/repos/clearcotelabs/clearcote-browser/releases/latest
        | jq -r '.assets[].name
        | select(endswith("-linux-x64.tar.xz"))
        | capture("clearcote-(?<v>[0-9.]+)-linux").v'

  clearcote-release:
    name: Update clearcote (release)
    needs: [clearcote-version]
    uses: ahobsonsayers/github-workflows/.github/workflows/docker-update-app-version.yaml@main
    secrets: inherit
    with:
      app-name: clearcote release
      dockerfile: Dockerfile
      version-arg: CLEARCOTE_RELEASE
      version-source: github
      version-source-github-repo: clearcotelabs/clearcote-browser
