name: Build and Push

on:
  # Manual Invocation
  workflow_dispatch:
    inputs:
      tags:
        description: Docker Image Tag(s)
        type: string
        default: develop
      app-version:
        description: App version (defaults to the latest git tag, else dev-<commit>)
        type: string
        default: ""

  # Workflow Invocation
  workflow_call:
    inputs:
      tags:
        description: Docker Image Tag(s)
        type: string
        required: true
      app-version:
        description: App version (defaults to the latest git tag, else dev-<commit>)
        type: string
        default: ""

jobs:
  get-tags:
    name: Get tags
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    outputs:
      tags: ${{ steps.get-tags.outputs.tags }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get tags
        id: get-tags
        run: |
          AGENT_BROWSER_VERSION=$(grep '^ARG AGENT_BROWSER_VERSION=' Dockerfile | cut -d '=' -f2)
          CLOAKBROWSER_VERSION=$(grep '^ARG CLOAKBROWSER_VERSION=' Dockerfile | cut -d '=' -f2)
          APP_VERSION="$INPUT_APP_VERSION"
          if [ -z "$APP_VERSION" ]; then
            APP_VERSION=$(git describe --tags --exact-match 2>/dev/null || echo "dev-$(git rev-parse --short HEAD)")
          fi

          {
            echo "tags<<EOF"
            echo "$INPUT_TAGS" | tr ',' '\n'
            echo "${APP_VERSION}-ab${AGENT_BROWSER_VERSION}-cb${CLOAKBROWSER_VERSION}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "App version: $APP_VERSION"
          echo "agent-browser: $AGENT_BROWSER_VERSION"
          echo "cloakbrowser: $CLOAKBROWSER_VERSION"
        env:
          INPUT_TAGS: ${{ inputs.tags }}
          INPUT_APP_VERSION: ${{ inputs.app-version }}

  build-push:
    name: Build and Push
    uses: ahobsonsayers/github-workflows/.github/workflows/docker-build-push.yaml@main
    needs: [get-tags]
    secrets: inherit
    with:
      image-name: arranhs/browserfull
      image-tags: ${{ needs.get-tags.outputs.tags }}
